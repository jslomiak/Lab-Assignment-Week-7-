  <body>
    <button id="button">Play Me!</button>
    <div id="note-display">Playing Note:</div>

    <div style="margin-top: 25px"></div>

    <button id="button2">Play Me!</button>
    <div id="note-display2">Playing Note:</div>

    <script>
      function playNote(
        someContext,
        frequency,
        duration,
        attackTime,
        waveForm,
      ) {
        if (someContext.state === "suspended") {
          someContext.resume();
        }

        const osc1 = new OscillatorNode(someContext);
        const osc2 = new OscillatorNode(someContext);
        const osc3 = new OscillatorNode(someContext);
        const gain = new GainNode(someContext);

        osc1.frequency.value = frequency;
        osc2.frequency.value = frequency * 2.01;
        osc3.frequency.value = frequency * 3.02;
        osc1.type = waveForm;
        osc2.type = waveForm;
        osc3.type = waveForm;
        gain.gain.value = 0;

        osc1.connect(gain).connect(someContext.destination);
        osc2.connect(gain).connect(someContext.destination);
        osc3.connect(gain).connect(someContext.destination);

        let now = someContext.currentTime;

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.exponentialRampToValueAtTime(
          0.3,
          now + duration * attackTime,
        ); //attack
        gain.gain.exponentialRampToValueAtTime(
          0.1,
          now * 0.01 + duration * 0.2,
        ); // decay
        gain.gain.exponentialRampToValueAtTime(
          0.05,
          now * 0.01 * 0.2 + duration * 0.2,
        ); //sustain
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration * 1); //release

        osc1.start();
        osc1.stop(now + duration);

        osc2.start();
        osc2.stop(now + duration);

        osc3.start();
        osc3.stop(now + duration);
      }

      const midiPitches = [69, 71, 73, 75, 76, 78, 80, 81]; // A Lydian

      const noteNames = {
        69: "A4",
        71: "B4",
        73: "C#5",
        75: "D#5",
        76: "E5",
        78: "F#5",
        80: "G#5",
        81: "A5",
      };

      const randomPitchData = function () {
        let randomMidiNote =
          midiPitches[Math.floor(Math.random() * midiPitches.length)];

        let newFreq = 440 * 2 ** ((randomMidiNote - 69) / 12);

        return {
          frequency: newFreq,
          name: noteNames[randomMidiNote],
        };
      };

      const randomDuration = function () {
        return Math.random() * 2 + 0.1;
      };

      const waveForms = ["sine", "square", "sawtooth", "triangle"];

      const randomWaveForm = function () {
        return waveForms[Math.floor(Math.random() * waveForms.length)];
      };

      const myCtx = new AudioContext();

      document.querySelector("#button").onclick = () => {
        const noteData = randomPitchData();

        document.querySelector("#note-display").textContent =
          `Playing Note: ${noteData.name}`;

        playNote(
          myCtx,
          noteData.frequency,
          randomDuration(),
          0.1,
          randomWaveForm(),
        );
      };

        osc4.start();
        osc4.stop(now + duration);

        osc5.start();
        osc5.stop(now + duration);

      }

      const midiPitches2 = [56, 59, 61, 63, 66, 68]; // G# Pentatonic

        return {

      };

      const randomDuration2 = function () {
        return Math.random() * 2 + 0.1;
        2;

        return waveForms2[Math.floor(Math.random() * waveForms2.length)];
